<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
  <title>Robin</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Theme colors (browser chrome + status bar) -->
  <meta name="theme-color" content="#F6F4EF"/>

  <!-- iOS: enable home-screen install + full-screen mode -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Robin"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>

  <!-- Standard favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>

  <!-- IBM Plex Mono — same font as the prototype -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- React 18 (UMD globals: React, ReactDOM) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (compiles JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Reset + global background matches the prototype's warm ground */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      background: #F6F4EF;
      font-family: 'IBM Plex Mono', monospace;
      color: #141414;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* Hide the loader once React mounts */
    #root:not(:empty) + #loader { display: none; }
    #loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #F6F4EF; color: #6b6b6b;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="loader">Loading Robin…</div>

  <!-- Load the prototype JSX. Babel compiles it in-browser.
       The prototype defines `function RobinApp()` at the top level. -->
  <script type="text/babel" data-presets="react" src="RobinApp.jsx"></script>

  <!-- Mount the app -->
  <script type="text/babel" data-presets="react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RobinApp />);
  </script>
</body>
</html>
